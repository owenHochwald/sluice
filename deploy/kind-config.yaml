# 1 control-plane + 2 workers, not the single-node default: the whole point
# of sluice is bypassing kube-proxy to reach pod IPs directly, so a topology
# that never schedules pods across more than one node would under-exercise
# exactly the thing being demonstrated (echod/surge replicas landing on
# different nodes with different pod IPs). Used by `make cluster` via
# `kind create cluster --config deploy/kind-config.yaml`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
